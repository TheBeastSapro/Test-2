[project]
name = "forgecast"
version = "0.1.0"
description = "An agent platform that builds and runs faceless YouTube channels: brief -> script -> voice -> visuals -> render -> publish, with human decision gates."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "httpx>=0.27",
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "pillow>=10.2",
    # Visual analysis runs on downscaled frames as arrays; everything in
    # forgecast/vision is numpy over ffmpeg output, with no other dependency.
    "numpy>=1.26",
    # The agent. It drives the Claude Code CLI with your own subscription login —
    # there is no API key involved, and this package is the Python half only. The
    # CLI itself is a Node install and the app reports its absence rather than
    # failing at the first message.
    "claude-agent-sdk>=0.2",
    # Reads a channel's public numbers with no API key and no account, which is what
    # makes pasting a channel link work on a fresh install.
    #
    # This was an optional extra, on the reasoning that it is a scraper that wants
    # updating often and that pinning it into the base install is a liability. That
    # reasoning was wrong about the thing that matters: the consequence was that the
    # agent answered the most obvious request in the app with "install yt-dlp", which
    # is the installer asking the operator to finish the installation. An install that
    # does not install something is not an install.
    #
    # The update concern is real and is handled where it belongs — `desktop.toolchain`
    # lists it with its version and can upgrade it in place, the same as the Claude CLI.
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
# No `research` extra. yt-dlp is a base dependency: reading a channel from a link is
# not an optional part of this app, and an extra meant the operator was told to run a
# pip command to finish an install that had already claimed to finish.
providers = [
    "openai>=1.30",
    "anthropic>=0.25",
    "elevenlabs>=1.0",
    "fal-client>=0.4",
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.scripts]
forgecast = "forgecast.cli:main"
forgecast-vision = "forgecast.vision.cli:main"
forgecast-voice = "forgecast.voice.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forgecast*"]
# Nothing outside the package, even if it acquires an `__init__.py`. `include` already
# does this; naming the exclusions as well means a future `include = ["*"]` cannot quietly
# turn `tests` or `tools` into shipped modules.
exclude = ["tests*", "tools*", "docs*", "remotion*", "migrations*"]

[tool.setuptools.package-data]
# The land mask the world-map renderer draws from. Without this a non-editable
# install has the code and not the geography, and the failure is a missing file at
# render time rather than at install time.
"forgecast.motion" = ["data/*.bin"]
# The templates and the stylesheet. A non-editable install without these has the
# routes and no pages, and the failure is a Jinja TemplateNotFound on the first
# request rather than anything visible at install time.
"forgecast.web" = ["*.html", "static/*"]
# The shipped skill documents. Without this a wheel install has the seeding code and none
# of the documents, and the symptom is a Skills page listing nothing — which reads as a
# product decision rather than as a missing package-data entry.
"forgecast.skills" = ["data/*.md"]

[tool.setuptools.exclude-package-data]
# The `static/*` glob above is a wildcard over a directory in the working tree, so it
# would carry anything that lands there. MANIFEST.in prunes these from an sdist; this is
# the same list for a wheel built straight from the source directory, where MANIFEST.in
# has no say. Both mirror EXCLUDE in tools/package.py.
"*" = [
    ".env", ".env.*",
    "*.pem", "*.key", "*.crt", "*.cer", "*.p12", "*.pfx",
    "id_rsa*", "id_ed25519*",
    "credentials.json", "client_secret*.json", "token.json",
    "*.db", "*.db-shm", "*.db-wal", "*.db-journal", "*.sqlite", "*.sqlite3",
    "*.log",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # `Depends(...)`/`Query(...)` in defaults is the FastAPI dependency-injection
    # idiom, not the mutable-default bug this rule exists to catch.
    "B008",
    # Long provider prompts and URLs read worse when broken across lines.
    "E501",
    # `str, Enum` rather than `StrEnum`: these classes are persisted through
    # SQLAlchemy's Enum type and serialised by Pydantic. Switching the base class
    # changes both behaviours for no gain.
    "UP042",
    # En dashes in user-facing prose are deliberate, not typos.
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
# Tests use lambdas and asserts freely.
"tests/*" = ["E731"]
