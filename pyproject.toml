[project]
name = "forgecast"
version = "0.1.0"
description = "An agent platform that builds and runs faceless YouTube channels: brief -> script -> voice -> visuals -> render -> publish, with human decision gates."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "httpx>=0.27",
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "pillow>=10.2",
    # Visual analysis runs on downscaled frames as arrays; everything in
    # forgecast/vision is numpy over ffmpeg output, with no other dependency.
    "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
providers = [
    "openai>=1.30",
    "anthropic>=0.25",
    "elevenlabs>=1.0",
    "fal-client>=0.4",
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.scripts]
forgecast = "forgecast.cli:main"
forgecast-vision = "forgecast.vision.cli:main"
forgecast-voice = "forgecast.voice.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forgecast*"]

[tool.setuptools.package-data]
# The land mask the world-map renderer draws from. Without this a non-editable
# install has the code and not the geography, and the failure is a missing file at
# render time rather than at install time.
"forgecast.motion" = ["data/*.bin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # `Depends(...)`/`Query(...)` in defaults is the FastAPI dependency-injection
    # idiom, not the mutable-default bug this rule exists to catch.
    "B008",
    # Long provider prompts and URLs read worse when broken across lines.
    "E501",
    # `str, Enum` rather than `StrEnum`: these classes are persisted through
    # SQLAlchemy's Enum type and serialised by Pydantic. Switching the base class
    # changes both behaviours for no gain.
    "UP042",
    # En dashes in user-facing prose are deliberate, not typos.
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
# Tests use lambdas and asserts freely.
"tests/*" = ["E731"]
