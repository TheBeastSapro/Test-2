<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="public/js/gsap.min.js"></script>
    <style>
      /* Vu's ACTUAL face, confirmed by pixel comparison against his publish cut. */
      @font-face { font-family:"HouseTitle"; src:url("public/fonts/comic-sans-ms-bold.ttf") format("truetype"); font-display:block; }

      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1920px; height:1080px; overflow:hidden; background:#FFFFFF; }

      /* ------------------------------------------------------------------
         THE GRAMMAR, measured from Vu's publish cut and M Simplified.

         MOTION IS BIMODAL, NOT UNIFORM. Measured across Vu's 9:42: mean 26.4%
         change per second but MEDIAN 15.3%, std dev 28.1%, with 30.8% of
         seconds under 5% and 26.7% over 40%. He holds, then changes
         decisively. A renderer that targets the 26% average produces constant
         mid-level drift, hits the number exactly, and looks like an AI edit.
         So: long holds with intent, punctuated by hard decisive changes.

         STORY beats sit on a plate the editor owns, creature composited in.
         SPEC beats bleed the creature on white. Then return to the plate.
         ------------------------------------------------------------------ */

      .stage { position:absolute; inset:0; overflow:hidden; }
      .plate { position:absolute; inset:0; }
      .plate img { position:absolute; left:0; top:0; width:1920px; height:1080px;
                   transform-origin:50% 50%; will-change:transform; }
      .white { position:absolute; inset:0; background:#FFFFFF; }
      .creature { position:absolute; left:0; top:0; transform-origin:50% 50%;
                  will-change:transform; }

      /* Persistent creature name, top centre, on every frame.
         Fill is CONTEXTUAL, measured from Vu: black with no stroke on a white
         canvas; white with a dark stroke plus an outer white highlight over a
         plate. The outer highlight comes from layered text-shadow rather than a
         duplicated text node - a stacked copy reads to any checker as two
         overlapping text blocks, and as white-on-white on the canvas beats. */
      .title { position:absolute; left:0; top:38px; width:1920px; text-align:center;
               font-family:"HouseTitle",sans-serif; font-size:82px;
               will-change:transform,opacity;
               color:#FFFFFF; -webkit-text-stroke:7px #111111; paint-order:stroke fill;
               text-shadow:
                 5px 0 0 #FFF, -5px 0 0 #FFF, 0 5px 0 #FFF, 0 -5px 0 #FFF,
                 4px 4px 0 #FFF, -4px 4px 0 #FFF, 4px -4px 0 #FFF, -4px -4px 0 #FFF; }
      .title.onWhite { color:#111111; -webkit-text-stroke-width:0; text-shadow:none; }

      /* Keyword pops: 1 to 4 words, never a sentence. Anchored to spoken words. */
      .pop { position:absolute; font-family:"HouseTitle",sans-serif; font-size:64px;
             white-space:nowrap; will-change:transform,opacity;
             color:#FFFFFF; -webkit-text-stroke:6px #111111; paint-order:stroke fill;
             text-shadow:
               4px 0 0 #FFF, -4px 0 0 #FFF, 0 4px 0 #FFF, 0 -4px 0 #FFF,
               3px 3px 0 #FFF, -3px 3px 0 #FFF, 3px -3px 0 #FFF, -3px -3px 0 #FFF; }
      .pop.ink { color:#111111; -webkit-text-stroke-width:0; text-shadow:none; }
      .pop.red { color:#D62020; -webkit-text-stroke:6px #111111; }

      svg.ov { position:absolute; inset:0; width:1920px; height:1080px; overflow:visible; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="62"
         data-width="1920" data-height="1080" data-fps="30">

      <audio id="vo" class="clip" data-start="0" data-duration="62" src="public/vo.wav"></audio>

      <!-- ============ A. HOOK on a plate. 0 - 14.64 ("hallway") ============ -->
      <div id="sceneA-hook" class="clip stage" data-start="0" data-duration="14.64" data-track-index="1">
        <div class="plate"><img id="pA" src="public/plate-street.jpg" /></div>
        <div id="popA1" class="pop" style="left:0;width:1920px;text-align:center;top:790px;">
          CANNOT HURT YOU</div>
        <div id="popA2" class="pop red" style="left:0;width:1920px;text-align:center;top:790px;">
          NOT GOOD NEWS</div>
        <div id="popA3" class="pop" style="left:0;width:1920px;text-align:center;top:790px;">
          IN HER DREAMS</div>
      </div>

      <!-- ============ B. THE REVEAL. 14.64 - 30.0 ============ -->
      <div id="sceneB-reveal" class="clip stage" data-start="14.64" data-duration="15.36" data-track-index="1">
        <div class="plate"><img id="pB" src="public/plate-interior.jpg" /></div>
        <img id="catB" class="creature" src="public/lh-cutout.png" />
        <div id="popB1" class="pop red" style="left:0;width:1920px;text-align:center;top:150px;">
          NO LOWER JAW</div>
        <div id="popB2" class="pop" style="left:0;width:1920px;text-align:center;top:820px;">
          GIANT HUMAN FINGERS</div>
        <div id="popB3" class="pop" style="left:0;width:1920px;text-align:center;top:820px;">
          FOREVER</div>
      </div>

      <!-- ============ C. SPEC BLOCK, bled on white. 30.0 - 48.0 ============ -->
      <div id="sceneC-spec" class="clip stage" data-start="30" data-duration="18" data-track-index="1">
        <div class="white"></div>
        <img id="catC" class="creature" src="public/lh-cutout.png" />
        <div id="popC1" class="pop ink" style="left:170px;top:300px;">
          100% FRIENDLY</div>
        <div id="popC2" class="pop ink" style="left:170px;top:400px;">
          INFINITE NECK</div>
        <div id="popC3" class="pop ink" style="left:170px;top:500px;">
          SMELLS OF CINNAMON</div>
        <div id="popC4" class="pop red" style="left:170px;top:600px;">
          IT COMES TO WARN</div>
      </div>

      <!-- ============ D. VERDICT, return to a plate. 48.0 - 62.0 ============ -->
      <div id="sceneD-verdict" class="clip stage" data-start="48" data-duration="14" data-track-index="1">
        <div class="plate"><img id="pD" src="public/plate-road.jpg" /></div>
        <img id="catD" class="creature" src="public/lh-cutout.png" />
        <div id="popD1" class="pop" style="left:0;width:1920px;text-align:center;top:830px;">
          YOU WILL SURVIVE</div>
        <div id="popD2" class="pop red" style="left:0;width:1920px;text-align:center;top:830px;">
          WHAT COMES AFTER</div>
      </div>

      <!-- persistent title, own tracks so it spans every canvas change -->
      <div id="tA" class="clip title" data-start="0" data-duration="30" data-track-index="2">Long Horse</div>
      <div id="tC" class="clip title onWhite" data-start="30" data-duration="18" data-track-index="3">Long Horse</div>
      <div id="tD" class="clip title" data-start="48" data-duration="14" data-track-index="4">Long Horse</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const POP_IN = 0.22;

      // A pop arrives ON its spoken word and leaves before the next one.
      function pop(sel, t, dur) {
        tl.fromTo(sel, {autoAlpha:0, y:26, scale:0.94},
                       {autoAlpha:1, y:0, scale:1, duration:POP_IN, ease:"back.out(1.6)"}, t);
        tl.to(sel, {autoAlpha:0, duration:0.16, ease:"power2.in"}, t + dur);
      }
      gsap.set(".pop", {autoAlpha:0});

      // ---- A. HOOK ------------------------------------------------------
      // Camera WITH INTENT, not idle wobble: one continuous travel across the
      // whole beat that arrives somewhere, rather than a drift to fill time.
      gsap.set("#pA", {scale:1.06, xPercent:0});
      tl.to("#pA", {scale:1.16, x:-46, duration:14.64, ease:"none"}, 0);
      pop("#popA1", 2.48, 1.5);        // "cannot hurt you"
      pop("#popA2", 3.92, 1.6);        // "not good news"
      pop("#popA3", 6.76, 1.5);        // "dreams"
      // 8.3 -> 14.64 is deliberately quiet. The measured reference is under 5%
      // change for ~31% of its runtime; this is the hold before the reveal.

      // ---- B. THE REVEAL ------------------------------------------------
      // Hard cut on the word "hallway". The creature is ALREADY in frame at the
      // cut, mid-move, never growing from nothing.
      gsap.set("#pB", {scale:1.20});
      gsap.set("#catB", {xPercent:-50, yPercent:-50, x:1180, y:430, scale:0.62, rotation:-4});
      tl.to("#pB",   {scale:1.10, duration:15.36, ease:"none"}, 14.64);
      // bends INTO frame, the skull arriving around the door frame
      tl.fromTo("#catB", {x:1720, scale:0.52, autoAlpha:0.85},
                         {x:1180, scale:0.62, autoAlpha:1, duration:1.5, ease:"power3.out"}, 14.64);
      pop("#popB1", 18.16, 1.9);       // "no lower jaw" - the canon anatomy beat
      // the neck keeps going: one continuous travel under the narration
      tl.to("#catB", {x:840, scale:0.94, rotation:0, duration:7.2, ease:"none"}, 20.44);
      pop("#popB2", 22.56, 1.7);       // "giant human fingers"
      pop("#popB3", 28.34, 1.5);       // "forever"

      // ---- C. SPEC BLOCK -------------------------------------------------
      // Bled on white, no box, no border. Labels arrive ONE AT A TIME on their
      // own spoken beat; a pre-assembled list sitting for 5s is a graded fail.
      gsap.set("#catC", {xPercent:-50, yPercent:-50, x:1290, y:600, scale:0.86});
      tl.to("#catC", {x:1230, scale:0.94, duration:18, ease:"none"}, 30);
      pop("#popC1", 31.20, 3.6);
      pop("#popC2", 35.80, 3.4);       // "genuinely infinite"
      pop("#popC3", 42.36, 2.6);       // "cinnamon"
      pop("#popC4", 45.58, 2.2);       // "to warn"

      // ---- D. VERDICT ----------------------------------------------------
      // Return to a plate, closer than we left it, so the section escalates.
      // The closer lands ON THE CREATURE. Never a gag as the final frame.
      gsap.set("#pD", {scale:1.10});
      gsap.set("#catD", {xPercent:-50, yPercent:-50, x:960, y:600, scale:1.05});
      tl.to("#pD",   {scale:1.20, duration:14, ease:"none"}, 48);
      tl.to("#catD", {scale:1.28, y:560, duration:14, ease:"none"}, 48);
      pop("#popD1", 54.10, 2.2);       // "you will survive long horse"
      pop("#popD2", 58.60, 2.6);

      // ---- titles: animate in, never appear by cutting to them ------------
      [["#tA",0],["#tC",30],["#tD",48]].forEach(([s,t]) => {
        tl.from(s, {y:-30, autoAlpha:0, duration:0.38, ease:"power3.out"}, t);
      });

      // Hard kills at every clip boundary. Non-linear seeking can land after a
      // fade-out tween and leave an element visible; a tl.set is unambiguous.
      tl.set("#popA1", {autoAlpha:0}, 14.64);
      tl.set("#popA2", {autoAlpha:0}, 14.64);
      tl.set("#popA3", {autoAlpha:0}, 14.64);
      tl.set("#popB1", {autoAlpha:0}, 30);
      tl.set("#popB2", {autoAlpha:0}, 30);
      tl.set("#popB3", {autoAlpha:0}, 30);
      tl.set("#popC1", {autoAlpha:0}, 48);
      tl.set("#popC2", {autoAlpha:0}, 48);
      tl.set("#popC3", {autoAlpha:0}, 48);
      tl.set("#popC4", {autoAlpha:0}, 48);
      tl.set("#popD1", {autoAlpha:0}, 61.99);
      tl.set("#popD2", {autoAlpha:0}, 61.99);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
