<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Vendored. Never fetch a render-time dependency: it makes the render
         non-deterministic and it is what made `check` fail with a nav timeout. -->
    <script src="public/js/gsap.min.js"></script>
    <style>
      /* Vu's ACTUAL face. Confirmed by pixel comparison against his publish cut:
         every letterform matches. Not an approximation - Comic Neue, Baloo,
         Fredoka and Chewy were all tested against the reference and rejected. */
      @font-face { font-family:"HouseTitle"; src:url("public/fonts/comic-sans-ms-bold.ttf") format("truetype"); font-display:block; }
      @font-face { font-family:"ArchivoBlack"; src:url("public/fonts/archivo-black-latin-400-normal.ttf") format("truetype"); font-display:block; }

      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1920px; height:1080px; overflow:hidden; background:#FFFFFF; }

      /* ---------------------------------------------------------------
         SCENE GRAMMAR, measured from M Simplified (docs/teardown-*.md):
           STORY beats  -> creature cutout composited onto ONE persistent
                           plate the editor owns; the creature APPROACHES by
                           scaling up across successive shots; stick figures
                           are scale and victims and they react.
           SPEC beats   -> creature BLED on white, no box, no border. Yellow
                           carries numbers and size claims, red carries damage,
                           arrows and measurement rules, green carries labels.
           Then RETURN to the plate to close.
         --------------------------------------------------------------- */

      .stage { position:absolute; inset:0; overflow:hidden; }
      .plate { position:absolute; inset:0; }
      .plate img { position:absolute; left:0; top:0; width:1920px; height:1080px;
                   transform-origin:50% 50%; will-change:transform; }
      .white { position:absolute; inset:0; background:#FFFFFF; }

      /* Creature layer. Scaled and moved by transform ONLY: Chrome snaps layout
         to whole device pixels and emits duplicate frames on slow moves, which
         measures as dead air. */
      .creature { position:absolute; left:0; top:0; transform-origin:50% 100%;
                  will-change:transform; }

      .fig { position:absolute; transform-origin:50% 100%; will-change:transform; }

      /* Persistent creature name. On every frame.
         MEASURED, not assumed. Zooming the title band 7x on frames with a
         creature/plate behind it and on white-canvas frames shows the SAME
         treatment on both grounds: WHITE FILL with a dark outline, never black
         text. Over busy backgrounds there is also a lighter outer edge - a
         second, outer white stroke used as a highlight so the type separates
         from whatever is behind it.
         -webkit-text-stroke can only draw ONE stroke, so the outer highlight is
         a stacked copy sitting behind the real one. */
      .title { position:absolute; left:0; top:44px; width:1920px; text-align:center;
               font-family:"HouseTitle",sans-serif; font-size:78px; letter-spacing:0px; will-change:transform,opacity; }
      .title .t { position:relative; display:inline-block; }
      /* Layer 1, behind: the OUTER WHITE HIGHLIGHT that lifts the type off a
         busy plate. This is the layer that was missing. */
      .title .t .halo { position:absolute; left:0; top:0; z-index:0; color:#FFFFFF;
                        -webkit-text-stroke:15px #FFFFFF; paint-order:stroke fill; }
      /* Layer 2, in front: the letterform. White fill, dark inner stroke. */
      .title .t .face { position:relative; z-index:1; color:#FFFFFF;
                        -webkit-text-stroke:7px #111111; paint-order:stroke fill; }
      /* On a flat white canvas the outer highlight has nothing to separate
         from. Fill stays white, dark stroke still defines the letters. */
      /* MEASURED from Vu's publish cut: on a WHITE CANVAS the title is BLACK
         with no stroke at all. Over a scene/plate it is WHITE with a black
         stroke plus the outer white highlight. The fill is contextual. */
      .title.onWhite .t .halo { -webkit-text-stroke-width:0; }
      .title.onWhite .t .face { color:#111111; -webkit-text-stroke-width:0; }

      .label { position:absolute; font-family:"ArchivoBlack",sans-serif;
               font-size:46px; letter-spacing:1px; white-space:nowrap;
               will-change:transform,opacity; }
      .lab-num  { color:#D8C21A; }              /* yellow: numbers and size claims */
      .lab-tag  { color:#111111; }              /* ink: plain anatomy labels      */
      .lab-date { color:#D62020; }              /* the one red accent: canon dates */

      svg.ov { position:absolute; inset:0; width:1920px; height:1080px; overflow:visible; }
      .slot { position:absolute; right:14px; bottom:10px; font-family:"ArchivoBlack",sans-serif;
              font-size:15px; letter-spacing:2px; color:#9a9a9a; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18"
         data-width="1920" data-height="1080" data-fps="30">

      <!-- ================= STORY BLOCK A : one plate, creature approaches ==== -->
      <div id="sA" class="clip stage" data-start="0" data-duration="8" data-track-index="1">
        <div class="plate"><img id="plateA" src="public/plate-night-street.jpg" /></div>

        <!-- stick figures: scale reference AND victims -->
        <svg class="ov" id="figs">
          <g id="fig1" class="fig" transform="translate(1330,880)">
            <circle cx="0" cy="-96" r="19" fill="#111"/>
            <line x1="0" y1="-77" x2="0" y2="-26" stroke="#111" stroke-width="11"/>
            <line x1="0" y1="-64" x2="-24" y2="-40" stroke="#111" stroke-width="10"/>
            <line x1="0" y1="-64" x2="24" y2="-40" stroke="#111" stroke-width="10"/>
            <line x1="0" y1="-26" x2="-18" y2="8" stroke="#111" stroke-width="10"/>
            <line x1="0" y1="-26" x2="18" y2="8" stroke="#111" stroke-width="10"/>
          </g>
          <g id="fig2" class="fig" transform="translate(1444,884)">
            <circle cx="0" cy="-90" r="18" fill="#111"/>
            <line x1="0" y1="-72" x2="0" y2="-24" stroke="#111" stroke-width="11"/>
            <line x1="0" y1="-60" x2="26" y2="-74" stroke="#111" stroke-width="10"/>
            <line x1="0" y1="-60" x2="-22" y2="-38" stroke="#111" stroke-width="10"/>
            <line x1="0" y1="-24" x2="-20" y2="8" stroke="#111" stroke-width="10"/>
            <line x1="0" y1="-24" x2="20" y2="8" stroke="#111" stroke-width="10"/>
          </g>
        </svg>

        <img id="catA" class="creature" src="public/cartoon-cat-silhouette.png" />

        <!-- damage: jagged red, the moment of contact -->
        <svg class="ov" id="atk" style="opacity:0">
          <polyline points="820,700 980,742 900,786 1180,830" fill="none"
                    stroke="#D62020" stroke-width="11" stroke-linejoin="round"/>
          <polyline points="820,700 1010,672 940,742 1300,772" fill="none"
                    stroke="#D62020" stroke-width="11" stroke-linejoin="round"/>
        </svg>

        <div class="slot">ASSET SLOT 01</div>
      </div>

      <!-- ================= SPEC BLOCK : bled on white, no box ================ -->
      <div id="sB" class="clip stage" data-start="8" data-duration="6" data-track-index="1">
        <div class="white"></div>
        <img id="catB" class="creature" src="public/cartoon-cat-cutout.png" />
        <svg class="ov" id="arrow" style="opacity:0">
          <line x1="1300" y1="470" x2="1102" y2="556" stroke="#D62020" stroke-width="10"/>
          <polygon points="1102,556 1140,540 1136,572" fill="#D62020"/>
        </svg>
        <div id="labDate" class="label lab-date" style="left:250px; top:300px;">AUGUST 4, 2018</div>
        <div id="labGlove" class="label lab-tag" style="left:1320px; top:440px;">WHITE GLOVES</div>
        <div id="labProp" class="label lab-num" style="left:250px; top:392px;">RUBBER-HOSE PROPORTIONS</div>
        <div class="slot">ASSET SLOT 02</div>
      </div>

      <!-- ================= STORY BLOCK B : return to the plate =============== -->
      <div id="sC" class="clip stage" data-start="14" data-duration="4" data-track-index="1">
        <div class="plate"><img id="plateC" src="public/plate-night-street.jpg" /></div>
        <img id="catC" class="creature" src="public/cartoon-cat-silhouette.png" />
        <div class="slot">ASSET SLOT 03</div>
      </div>

      <!-- persistent title, its own track because it spans everything -->
      <div id="tA" class="clip title onPlate" data-start="0" data-duration="8"  data-track-index="2"><span class="t"><span class="halo">Cartoon Cat</span><span class="face">Cartoon Cat</span></span></div>
      <div id="tB" class="clip title onWhite" data-start="8" data-duration="6"  data-track-index="3"><span class="t"><span class="halo">Cartoon Cat</span><span class="face">Cartoon Cat</span></span></div>
      <div id="tC" class="clip title onPlate" data-start="14" data-duration="4" data-track-index="4"><span class="t"><span class="halo">Cartoon Cat</span><span class="face">Cartoon Cat</span></span></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- STORY A -------------------------------------------------------
      // The creature APPROACHES. One plate, the creature layer scales up. This
      // is the measured M Simplified signature: "one plate held while the
      // creature layer scales up and rises from behind a mid-ground occluder".
      gsap.set("#catA", { xPercent:-50, x:900, y:250, scale:0.42, transformOrigin:"50% 100%" });
      gsap.set("#plateA", { scale:1.04 });

      // Plate drifts slowly. This is CAMERA WITH INTENT, not idle wobble: it
      // travels toward the subject across the whole block and arrives on it.
      tl.to("#plateA", { scale:1.12, x:-40, duration:8, ease:"none" }, 0);

      // Approach in three stages, not one linear creep, so each stage reads as
      // a decision rather than a drift.
      tl.to("#catA", { scale:0.72, y:180, duration:3.0, ease:"power1.inOut" }, 0.4);
      tl.to("#catA", { scale:1.25, y:60,  duration:2.2, ease:"power2.in" }, 3.6);

      // Figures react. Reaction lands ON the causing frame, never after it.
      tl.to("#fig1", { rotation:-14, x:-26, duration:0.5, ease:"power2.out" }, 3.6);
      tl.to("#fig2", { rotation:10,  x:22,  duration:0.5, ease:"power2.out" }, 3.7);

      // Stillness before the climax: the dramatic comma. A renderer maximising
      // motion would never insert this, and the hit lands softer without it.
      tl.to({}, { duration:0.55 }, 5.8);

      // Contact.
      tl.set("#atk", { opacity:1 }, 6.35);
      tl.fromTo("#atk", { scaleX:0.6, transformOrigin:"0% 50%" },
                        { scaleX:1, duration:0.18, ease:"power3.out" }, 6.35);
      tl.to("#fig1", { rotation:-78, x:-150, y:34, duration:0.42, ease:"power3.out" }, 6.4);
      tl.to("#fig2", { rotation:64,  x:130,  y:30, duration:0.42, ease:"power3.out" }, 6.45);
      tl.to("#atk",  { opacity:0, duration:0.2 }, 6.9);
      // impact shake on the plate, decaying
      tl.to("#plateA", { x:"+=26", duration:0.05, ease:"none", yoyo:true, repeat:5 }, 6.35);

      // ---- SPEC B --------------------------------------------------------
      // Bled on white. No box, no border: measured, both references agree.
      gsap.set("#catB", { xPercent:-50, x:960, y:120, scale:1.34, transformOrigin:"50% 100%" });
      tl.from("#catB", { x:1010, scale:1.42, duration:6, ease:"none" }, 8);

      // Labels arrive one at a time on their own beat, never pre-assembled.
      // A pre-assembled icon grid sitting for 5s is a graded failure here.
      [["#labDate",8.25],["#labProp",9.5],["#labGlove",10.9]].forEach(([s,t]) => {
        tl.fromTo(s, { y:22, scale:0.94, autoAlpha:0 },
                     { y:0, scale:1, autoAlpha:1, duration:0.22, ease:"back.out(1.6)" }, t);
      });
      tl.fromTo("#arrow", { autoAlpha:0, x:40 }, { autoAlpha:1, x:0, duration:0.24, ease:"power3.out" }, 11.0);

      // ---- STORY C -------------------------------------------------------
      // Return to the plate. Closer than we left it, so the section escalates.
      gsap.set("#catC", { xPercent:-50, x:960, y:40, scale:1.55, transformOrigin:"50% 100%" });
      gsap.set("#plateC", { scale:1.18 });
      tl.to("#plateC", { scale:1.26, duration:4, ease:"none" }, 14);
      tl.to("#catC",   { scale:1.78, y:0, duration:4, ease:"none" }, 14);

      // ---- titles: animate in, never appear by cutting to them ------------
      [["#tA",0],["#tB",8],["#tC",14]].forEach(([s,t]) => {
        tl.from(s, { y:-34, autoAlpha:0, duration:0.4, ease:"power3.out" }, t);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
